<style>
:root{--bg:#e9e6df;--fg:#1d1d1b;--mut:#6b6a65}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,'Segoe UI',sans-serif}
header{display:flex;justify-content:space-between;align-items:baseline;padding:22px 28px;position:sticky;top:0;background:var(--bg);z-index:3}
header b{font-weight:500;font-size:18px}header a{color:var(--mut);text-decoration:none;margin-left:22px}header a:hover{color:var(--fg)}
.intro{padding:40px 28px 24px;max-width:760px;font-size:clamp(22px,3.4vw,34px);line-height:1.25}.intro span{color:var(--mut)}
.f{display:flex;gap:8px;padding:0 28px 18px;flex-wrap:wrap}.f button{font:inherit;border:1px solid #bdb7aa;background:none;border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--mut)}.f button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.g{columns:3 260px;column-gap:14px;padding:0 28px 60px}
.c{break-inside:avoid;margin:0 0 14px;position:relative;overflow:hidden;display:block;color:#fff;text-decoration:none;background:#cfcac0}
.c img{width:100%;display:block;transition:transform .6s}.c:hover img{transform:scale(1.05)}
.c span{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.65));transform:translateY(100%);transition:transform .3s}
.c:hover span,.c:focus-visible span{transform:none}.c b{display:block;font-weight:500}.c small{opacity:.85}

<header><b>Romain Pitot</b><span><a href="../about.html">About</a><a href="../code.html">Code</a><a href="../contact.html">Contact</a><a href="index.html">Prototypes</a></span></header>

<script>
const DATA=[{"id": "legend-of-mulu", "title": "The Legend of Mulu", "year": 2023, "cat": "Work", "status": "Archived", "desc": "Exploration game on The Sandbox: a young girl tracks down sorcerers who stole her village's sacred artifacts.", "cover": "../assets/img/projects/legend-of-mulu-1.jpg", "tech": ["C#", "Unity", "The Sandbox"]}, {"id": "kissoro", "title": "Kissoro Tribal Game", "year": 2023, "cat": "Work", "status": "Archived", "desc": "African strategy board game on mobile — migrated from Unity 2018 to 2022 and stabilized across devices.", "cover": "../assets/img/projects/kissoro-2.jpg", "tech": ["C#", "Unity", "Mobile"]}, {"id": "vaudoo", "title": "Vaudoo", "year": 2023, "cat": "Work", "status": "Released", "desc": "Mobile zombie shooter on Google Play: a presidential candidate raises the dead to win an election, then fights the apocalypse.", "cover": "../assets/img/projects/vaudoo-cover.jpg", "tech": ["C#", "Unity", "Mobile"]}, {"id": "little-cup", "title": "Little Cup", "year": 2023, "cat": "Work", "status": "Prototype", "desc": "Mobile penalty-shootout game: aim, power and technique against increasingly skilled goalkeepers.", "cover": "../assets/img/projects/little-cup-cover.jpg", "tech": ["C#", "Unity", "Mobile"]}, {"id": "medieval-skirmish", "title": "Medieval Skirmish", "year": 2022, "cat": "School", "status": "Prototype", "desc": "Tower defense where you place towers and cast spells (fireball, freeze) to hold off waves of enemies.", "cover": "../assets/img/projects/medieval-skirmish-cover.jpg", "tech": ["C#", "Unity", "Design Patterns"]}, {"id": "shipwrecked-island", "title": "Shipwrecked Island", "year": 2022, "cat": "School", "status": "Prototype", "desc": "Multiplayer horror survival: gather resources and repair your ship before the hidden saboteur stops you.", "cover": "../assets/img/projects/shipwrecked-island-cover.jpg", "tech": ["C#", "Unity", "Netcode"]}, {"id": "just-dash", "title": "Just Dash", "year": 2022, "cat": "School", "status": "Released", "desc": "Mobile platformer mixing Doodle Jump's vertical momentum with Celeste's precision dashing.", "cover": "../assets/img/projects/just-dash-cover.jpg", "tech": ["C#", "Unity", "Mobile"]}, {"id": "keep-dancing-to-live", "title": "Keep Dancing to Live", "year": 2024, "cat": "Game Jam", "status": "Released", "desc": "Rhythm game: dance ridiculously as the king's jester, or it's off with your head. Global Game Jam 2024 — \"Make Me Laugh.\"", "cover": "../assets/img/projects/keep-dancing-to-live-1.jpg", "tech": ["C#", "Unity"]}, {"id": "thermostat-8", "title": "Thermostat 8", "year": 2021, "cat": "Game Jam", "status": "Released", "desc": "Exploration survival game built for a game jam on the theme \"Elevate.\"", "cover": "../assets/img/projects/thermostat-8-1.jpg", "tech": ["C#", "Unity", "VFX"]}, {"id": "falling-bot", "title": "Falling Bot", "year": 2021, "cat": "Game Jam", "status": "Released", "desc": "Pilot an energy-constrained robot descending through caverns. Ludum Dare 48 — \"Deeper and Deeper.\"", "cover": "../assets/img/projects/falling-bot-1.jpg", "tech": ["C#", "Unity", "VFX"]}, {"id": "trash-santa", "title": "Trash Santa", "year": 2020, "cat": "Game Jam", "status": "Released", "desc": "Chaotic multiplayer game about stealing presents from unsuspecting kids. Global Game Jam 2020 — \"Repair.\"", "cover": "../assets/img/projects/trash-santa-cover.jpg", "tech": ["C#", "Unity", "Multiplayer"]}, {"id": "global-invasion", "title": "Global Invasion", "year": 2026, "cat": "Personal", "status": "WIP", "desc": "Steam co-op for 1-4 players: exterminators investigate infested houses by day and survive the swarm by night.", "cover": "../assets/img/projects/global-invasion-1.jpg", "tech": ["C#", "Unity 6", "Netcode for GameObjects"]}, {"id": "on-air", "title": "On Air", "year": 2026, "cat": "Game Jam", "status": "Released", "desc": "Live TV, 1978, seven-second delay: you direct the control room and cut everything before it airs. Epic AI MegaJam 2026 — \"Director's Cut.\"", "cover": "../assets/img/projects/on-air-1.jpg", "tech": ["C++", "Unreal Engine 5", "UMG"]}, {"id": "climb-euw", "title": "CLIMB.EUW", "year": 2026, "cat": "App", "status": "Released", "desc": "Web app that tracks a League of Legends SoloQ climb game by game, detects sessions and exports a recap for an AI coach.", "cover": "../assets/img/projects/climb-euw-cover.jpg", "tech": ["JavaScript", "React", "Vite"]}, {"id": "game-detector-lol", "title": "GameDetectorLol", "year": 2026, "cat": "App", "status": "Released", "desc": "Windows companion app that watches the League of Legends client and game and shows the live match status on CLIMB.EUW.", "cover": "../assets/img/projects/game-detector-lol-cover.jpg", "tech": ["Python", "Local REST APIs", "Windows installer"]}];const g=document.getElementById('g'),f=document.getElementById('f');let cur='All';
const cats=['All',...new Set(DATA.map(p=>p.cat))];
function render(){g.innerHTML='';DATA.filter(p=>cur==='All'||p.cat===cur).forEach(p=>{g.insertAdjacentHTML('beforeend',`<a class="c" href="../projects/${p.id}.html"><img src="${p.cover}" alt="${p.title}" loading="lazy"><span><b>${p.title}</b><small>${p.year} · ${p.cat}</small></span></a>`)});
f.innerHTML=cats.map(c=>`<button class="${c===cur?'on':''}">${c}</button>`).join('');f.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.textContent;render()})}
render();
</script></body></html>
