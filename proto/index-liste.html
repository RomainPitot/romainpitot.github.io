<style>
:root{--bg:#101216;--fg:#e8e6e1;--mut:#8a8f98;--line:#2a2e36;--acc:#f4b942}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 ui-monospace,'JetBrains Mono',Consolas,monospace}
.w{max-width:1000px;margin:0 auto;padding:0 28px}
header{display:flex;justify-content:space-between;padding:28px 0;color:var(--mut)}header a{color:inherit;text-decoration:none;margin-left:20px}header a:hover{color:var(--acc)}
h1{font:400 clamp(30px,5vw,56px)/1.05 Georgia,serif;margin:50px 0 12px;letter-spacing:-.01em}.lead{color:var(--mut);max-width:560px;margin:0 0 50px}
.row{display:grid;grid-template-columns:60px 1fr 160px 110px;gap:16px;padding:18px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none;align-items:baseline;transition:padding .25s,color .25s}
.row:last-child{border-bottom:1px solid var(--line)}.row .t{font:400 26px Georgia,serif}.row:hover{padding-left:14px;color:var(--acc)}.row .m{color:var(--mut)}
#pv{position:fixed;width:300px;height:190px;object-fit:cover;pointer-events:none;opacity:0;border-radius:4px;transition:opacity .2s;z-index:5;box-shadow:0 20px 50px #0008}
footer{padding:70px 0;color:var(--mut)}footer a{color:var(--acc)}
@media(max-width:760px){.row{grid-template-columns:36px 1fr}.row .m{display:none}#pv{display:none}}

sed", "desc": "Mobile platformer mixing Doodle Jump's vertical momentum with Celeste's precision dashing.", "cover": "../assets/img/projects/just-dash-cover.jpg", "tech": ["C#", "Unity", "Mobile"]}, {"id": "keep-dancing-to-live", "title": "Keep Dancing to Live", "year": 2024, "cat": "Game Jam", "status": "Released", "desc": "Rhythm game: dance ridiculously as the king's jester, or it's off with your head. Global Game Jam 2024 — \"Make Me Laugh.\"", "cover": "../assets/img/projects/keep-dancing-to-live-1.jpg", "tech": ["C#", "Unity"]}, {"id": "thermostat-8", "title": "Thermostat 8", "year": 2021, "cat": "Game Jam", "status": "Released", "desc": "Exploration survival game built for a game jam on the theme \"Elevate.\"", "cover": "../assets/img/projects/thermostat-8-1.jpg", "tech": ["C#", "Unity", "VFX"]}, {"id": "falling-bot", "title": "Falling Bot", "year": 2021, "cat": "Game Jam", "status": "Released", "desc": "Pilot an energy-constrained robot descending through caverns. Ludum Dare 48 — \"Deeper and Deeper.\"", "cover": "../assets/img/projects/falling-bot-1.jpg", "tech": ["C#", "Unity", "VFX"]}, {"id": "trash-santa", "title": "Trash Santa", "year": 2020, "cat": "Game Jam", "status": "Released", "desc": "Chaotic multiplayer game about stealing presents from unsuspecting kids. Global Game Jam 2020 — \"Repair.\"", "cover": "../assets/img/projects/trash-santa-cover.jpg", "tech": ["C#", "Unity", "Multiplayer"]}, {"id": "global-invasion", "title": "Global Invasion", "year": 2026, "cat": "Personal", "status": "WIP", "desc": "Steam co-op for 1-4 players: exterminators investigate infested houses by day and survive the swarm by night.", "cover": "../assets/img/projects/global-invasion-1.jpg", "tech": ["C#", "Unity 6", "Netcode for GameObjects"]}, {"id": "on-air", "title": "On Air", "year": 2026, "cat": "Game Jam", "status": "Released", "desc": "Live TV, 1978, seven-second delay: you direct the control room and cut everything before it airs. Epic AI MegaJam 2026 — \"Director's Cut.\"", "cover": "../assets/img/projects/on-air-1.jpg", "tech": ["C++", "Unreal Engine 5", "UMG"]}, {"id": "climb-euw", "title": "CLIMB.EUW", "year": 2026, "cat": "App", "status": "Released", "desc": "Web app that tracks a League of Legends SoloQ climb game by game, detects sessions and exports a recap for an AI coach.", "cover": "../assets/img/projects/climb-euw-cover.jpg", "tech": ["JavaScript", "React", "Vite"]}, {"id": "game-detector-lol", "title": "GameDetectorLol", "year": 2026, "cat": "App", "status": "Released", "desc": "Windows companion app that watches the League of Legends client and game and shows the live match status on CLIMB.EUW.", "cover": "../assets/img/projects/game-detector-lol-cover.jpg", "tech": ["Python", "Local REST APIs", "Windows installer"]}];const l=document.getElementById('l'),pv=document.getElementById('pv');
